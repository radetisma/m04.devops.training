version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Docker Build
    dependencies: []
    task:
      jobs:
        - name: Build and Push
          commands:
            - checkout
      secrets:
        - name: DockerHub
